services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cmms_dev
      POSTGRES_USER: cmms_user
      POSTGRES_PASSWORD: cmms_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Copiloto de IA -- corre 100% local, no manda datos afuera. Despues de
  # "docker-compose up", la primera vez hay que descargar el modelo:
  #   docker exec -it cmms-api-ollama-1 ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  minio_data:
  ollama_data:
